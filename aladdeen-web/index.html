<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script>
			(function () {
				try {
					var theme = localStorage.getItem("theme");
					var dark =
						theme === "dark" ||
						(theme !== "light" &&
							window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
				} catch (error) {}
			})();
		</script>
		<title>Aladdeen Research — Your research, one calm workspace</title>
		<meta
			name="description"
			content="A local-first macOS research workspace for Markdown, HTML, Word, PDF, Excel, and PowerPoint—with an optional project-aware agent using your provider and model."
		/>
		<meta name="author" content="Aladdeen" />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://aladdeen.aliahad.com/" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Aladdeen Research" />
		<meta property="og:title" content="Aladdeen Research — Your research, one calm workspace" />
		<meta
			property="og:description"
			content="Work with six document formats in place, then turn on a project-aware agent using the provider and model you choose."
		/>
		<meta property="og:url" content="https://aladdeen.aliahad.com/" />
		<meta property="og:image" content="https://aladdeen.aliahad.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Aladdeen Research showing a local project beside its optional coding agent" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Aladdeen Research — Your research, one calm workspace" />
		<meta
			name="twitter:description"
			content="Local research files, six document formats, and an optional project-aware agent."
		/>
		<meta name="twitter:image" content="https://aladdeen.aliahad.com/og.png" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Aladdeen Research",
				"applicationCategory": "ProductivityApplication",
				"operatingSystem": "macOS arm64 on M-series Apple silicon",
				"softwareVersion": "__ALADDEEN_VERSION__",
				"description": "A local-first research workspace for Markdown, HTML, Word, PDF, Excel, and PowerPoint with an optional project-aware coding agent.",
				"url": "https://aladdeen.aliahad.com/",
				"downloadUrl": "https://aladdeen.aliahad.com__ALADDEEN_ARM64_PATH__",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				}
			}
		</script>
	</head>

	<body>
		<div id="root"></div>
		<noscript>Aladdeen’s website needs JavaScript for theme controls. Downloads remain available at __ALADDEEN_ARM64_PATH__.</noscript>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>

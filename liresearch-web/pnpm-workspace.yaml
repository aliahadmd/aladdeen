overrides:
  # Security overrides. Every advisory below is in build tooling (Vite plugin,
  # ESLint, Tailwind) and none of it ships in the deployed Worker. Each target is
  # the lowest patched version in the major line its consumer already accepts, and
  # each package resolves at a single major here, so plain overrides are safe.
  brace-expansion: 5.0.11 # GHSA-rgw5-rvv9-x895 plus two uncontrolled-recursion DoS advisories
  browserslist: 4.28.7 # GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g (memory growth / prototype write)
  js-yaml: 4.3.2 # GHSA-5p4m-2wfm-xmqj and the maxTotalMergeKeys CPU advisory
  nanoid: 3.3.18 # GHSA-2v37-7h3g-55p8 (infinite loop)
  sharp: 0.35.5 # GHSA-g89c-p67h-r497, GHSA-2jg2-4ch7-h545 (bundled libheif)
  undici: 7.30.1 # GHSA-4cwx-7wf7-3272, TLS validation bypass, unrequested-response DoS
  source-map-js: 1.2.2 # GHSA-68fv-2mgg-jv7q
  'vite@>=7 <8': 7.3.7 # GHSA-587h-7wmj-h5pm
  'zod@>=4 <5': 4.6.6 # GHSA-mrhx-c7xc-m3w5
# Zod 3 has no patched release for this oversized-collection validation DoS.
# It is used only by Miniflare and the local Workers test pool for developer
# configuration; no Zod code is bundled in the deployed Worker. Preserve their
# required Zod 3 API until Cloudflare migrates; all Zod 4 instances are patched.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
patchedDependencies:
  minimatch@3.1.5: ../patches/minimatch@3.1.5.patch
  minimatch@9.0.9: ../patches/minimatch@9.0.9.patch
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

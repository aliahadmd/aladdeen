allowBuilds:
  '@google/genai': true
  core-js: false
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  sharp: true
peerDependencyRules:
  allowedVersions:
    pdfjs-dist: '6'
    vite: '8'
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - sharp
overrides:
  # Security overrides. Each target is the lowest patched version inside the major
  # line its consumer already accepts, so no consumer is dragged across a major.
  # Scoped selectors are used where the tree legitimately holds several majors:
  # a blanket override there would force an incompatible version on the other
  # consumer. Re-run the assert-* release gates after touching any of these.
  brace-expansion: 5.0.9 # GHSA-rgw5-rvv9-x895 (DoS); tree holds only 5.x
  fast-uri: 3.1.5 # GHSA-7p8r-x3mc-p8w7 (host confusion); ajv wants ^3.0.1
  js-yaml: 4.3.1 # GHSA-5p4m-2wfm-xmqj (quadratic CPU); builder-util wants ^4.1.0
  tar: 7.5.21
  # undici resolves at both 6.27.0 and 7.28.0; only the 7.x line is affected by
  # GHSA-4cwx-7wf7-3272, so scope it and leave the 6.x consumer alone.
  '@electron/get>undici': 7.29.0
  # nanoid resolves at 3.x and 5.x. postcss needs v3, @univerjs/core pins 5.1.11
  # exactly, so both need separate patched targets.
  'postcss>nanoid': 3.3.18 # GHSA-2v37-7h3g-55p8
  '@univerjs/core>nanoid': 5.1.16 # GHSA-28wg-ghj8-5hjv
minimumReleaseAgeExclude:
  - tar@7.5.21
  - brace-expansion@5.0.9
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  minimatch@5.1.9: patches/minimatch@5.1.9.patch
  minimatch@9.0.9: patches/minimatch@9.0.9.patch
auditConfig:
  # image-size has two open DoS advisories with NO patched release: 2.0.2 is the
  # latest published and the fix is only in the unreleased 2.0.3. The single call
  # site (DOCX export) now verifies PNG/JPEG/GIF magic bytes before handing the
  # buffer to imageSize, so the affected ICNS/JXL/HEIF decoders are unreachable.
  # Scoped to these two ids on purpose: any NEW advisory still fails the gate.
  # Remove both once image-size >=2.0.3 ships.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr # image-size ICNS parser infinite loop
    - GHSA-5p2g-fcmc-qvqq # image-size JXL and HEIF parser infinite loops

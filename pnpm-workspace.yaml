allowBuilds:
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  sharp: true
peerDependencyRules:
  allowedVersions:
    pdfjs-dist: '6'
    vite: '8'
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - sharp
overrides:
  # Security overrides. Each target is the lowest patched version inside the major
  # line its consumer already accepts, so no consumer is dragged across a major.
  # Scoped selectors are used where the tree legitimately holds several majors:
  # a blanket override there would force an incompatible version on the other
  # consumer. Re-run the assert-* release gates after touching any of these.
  brace-expansion: 5.0.11 # GHSA-rgw5-rvv9-x895 plus two uncontrolled-recursion DoS advisories; tree holds only 5.x
  fast-uri: 3.1.7 # host confusion/SSRF batch, including the authority-injection and unclosed-bracket advisories against 3.1.6; ajv wants ^3.0.1
  js-yaml: 4.3.2 # GHSA-5p4m-2wfm-xmqj and the maxTotalMergeKeys CPU advisory; builder-util wants ^4.1.0
  tar: 7.5.21
  # undici resolves on two major lines (7.x for @electron/get, 6.x for node-gyp);
  # each consumer gets the lowest patched release of its own line.
  '@electron/get>undici': 7.30.1 # GHSA-4cwx-7wf7-3272, TLS validation bypass, unrequested-response DoS
  'node-gyp>undici': 6.29.1 # unrequested-response DoS
  # @xmldom/xmldom resolves at 0.8.x (plist, pptx-viewer-core) and 0.9.x
  # (docxtemplater); range selectors patch each line without crossing it.
  '@xmldom/xmldom@<0.9.0': 0.8.15 # name/attribute injection, ReDoS, quadratic memory
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12 # same batch on the 0.9 line
  '@grpc/grpc-js': 1.14.5 # only @univerjs/protocol pins 1.14.4
  # nanoid resolves at 3.x and 5.x. postcss needs v3, @univerjs/core pins 5.1.11
  # exactly, so both need separate patched targets.
  'postcss>nanoid': 3.3.18 # GHSA-2v37-7h3g-55p8
  '@univerjs/core>nanoid': 5.1.16 # GHSA-28wg-ghj8-5hjv
  source-map-js: 1.2.2 # GHSA-68fv-2mgg-jv7q
  proxy-addr: 2.0.8 # GHSA-jqcg-44mw-7w3h
  body-parser: 2.4.0 # GHSA-27r3-jxmh-p828
  '@modelcontextprotocol/sdk': 1.32.0 # HTTP transport security fixes, same 1.x API
  'vite@>=7 <8': 7.3.7 # GHSA-587h-7wmj-h5pm
  'vite@>=8 <9': 8.1.6 # same advisory on the 8.x line
  'zod@>=4 <5': 4.6.6 # GHSA-mrhx-c7xc-m3w5
  'dompurify@>=3 <4': 3.4.17 # sanitizer bypass fixes
  'prosemirror-view@>=1 <2': 1.42.3 # GHSA-c8x8-7fp4-3x9w
minimumReleaseAgeExclude:
  - tar@7.5.21
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  minimatch@5.1.9: patches/minimatch@5.1.9.patch
  minimatch@9.0.9: patches/minimatch@9.0.9.patch
auditConfig:
  # http-cache-semantics <=4.2.0 can disclose cross-user cached responses via
  # max-stale (GHSA-ch52-4w7c-c8xp). The advisory names 4.2.1 as the fix, but
  # 4.2.1 is not published yet. It is reached only through electron-builder's
  # download cache on the packaging machine and is not in the shipped app.asar.
  # Scoped to this one id: any NEW advisory still fails the gate. Remove once
  # http-cache-semantics >=4.2.1 is available and resolved here.
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp

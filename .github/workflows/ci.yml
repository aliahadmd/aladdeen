name: Build and test Aladdeen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aladdeen-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: aladdeen-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: dist:mac
          - os: windows-latest
            command: dist:win
          - os: ubuntu-latest
            command: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify ad-hoc macOS signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done < <(find release -type d -name 'Aladdeen.app' -print0)
      - uses: actions/upload-artifact@v4
        with:
          name: aladdeen-${{ matrix.os }}
          path: release/**
          if-no-files-found: error

appId: com.aladdeen.app
productName: Aladdeen
asar: true
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
fileAssociations:
  - ext:
      - md
      - markdown
    name: Markdown Document
    description: Markdown document
    role: Editor
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Keep the bundle internally consistent without requiring a paid Apple
  # Developer certificate. Gatekeeper will still require explicit user approval.
  identity: "-"
  hardenedRuntime: false
  notarize: false
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
publish: null

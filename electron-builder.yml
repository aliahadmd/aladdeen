appId: com.aladdeen.app
productName: Aladdeen
asar: true
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: release-staging/pi-runtime/node_modules
    to: pi-runtime/node_modules
  - from: resources/pi/aladdeen-approvals.ts
    to: pi/aladdeen-approvals.ts
fileAssociations:
  - ext:
      - md
      - markdown
    name: Markdown Document
    description: Markdown document
    role: Editor
  - ext:
      - html
      - htm
    name: HTML Document
    description: HTML document
    role: Editor
  - ext: docx
    name: Word Document
    description: Microsoft Word document
    role: Editor
  - ext: pdf
    name: PDF Document
    description: Portable Document Format
    role: Editor
  - ext: xlsx
    name: Excel Workbook
    description: Microsoft Excel workbook
    role: Editor
  - ext: pptx
    name: PowerPoint Presentation
    description: Microsoft PowerPoint presentation
    role: Editor
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Keep the bundle internally consistent without requiring a paid Apple
  # Developer certificate. Gatekeeper will still require explicit user approval.
  identity: "-"
  hardenedRuntime: true
  notarize: false
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
publish: null
